---
# Source: flask-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
    - port: 5001
      targetPort: 5001
---
# Source: flask-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: "shaharc20/flask-aws-monitor:9f9c5a9"
          ports:
            - containerPort: 5001
          env:
            - name: AWS_REGION
              value: "eu-north-1"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
