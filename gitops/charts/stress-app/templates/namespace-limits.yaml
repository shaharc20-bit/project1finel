{{- if .Values.namespaceLimits.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
spec:
  hard:
    {{- toYaml .Values.namespaceLimits.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-limits
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.namespaceLimits.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.namespaceLimits.defaultRequest | nindent 8 }}
{{- end }}
