# dev: 1 replica, small limits, NodePort. Jenkins updates the image tag of this environment on every build.
replicaCount: 1

image:
  tag: "latest"

service:
  type: NodePort
  port: 5001
  nodePort: 30501

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
