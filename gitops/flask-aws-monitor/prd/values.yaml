# prd: 3 replicas, higher limits, ClusterIP behind an Ingress. The image tag is promoted by hand (pull request).
replicaCount: 3

image:
  tag: "latest"

service:
  type: ClusterIP
  port: 5001

ingress:
  enabled: true
  className: traefik
  host: flask-prd.example.com
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
