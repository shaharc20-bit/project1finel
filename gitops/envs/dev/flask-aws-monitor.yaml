---
# Source: flask-aws-monitor/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
  ports:
    - name: http
      port: 5001
      targetPort: http
      protocol: TCP

---
# Source: flask-aws-monitor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-aws-monitor
      app.kubernetes.io/instance: flask-aws-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-aws-monitor
        app.kubernetes.io/instance: flask-aws-monitor
      annotations:
        checksum/aws: de2f2c31dd86d702
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: flask-aws-monitor
          image: "shaharc20/flask-aws-monitor:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: PORT
              value: "5001"
            - name: AWS_REGION
              value: "eu-north-1"
          envFrom:
            - secretRef:
                name: aws-credentials
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
