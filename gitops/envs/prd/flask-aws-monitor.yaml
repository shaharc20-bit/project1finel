---
# Source: flask-aws-monitor/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
  ports:
    - name: http
      port: 5001
      targetPort: http
      protocol: TCP

---
# Source: flask-aws-monitor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-aws-monitor
      app.kubernetes.io/instance: flask-aws-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-aws-monitor
        app.kubernetes.io/instance: flask-aws-monitor
      annotations:
        checksum/aws: de2f2c31dd86d702
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: flask-aws-monitor
          image: "shaharc20/flask-aws-monitor:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: PORT
              value: "5001"
            - name: AWS_REGION
              value: "eu-north-1"
          envFrom:
            - secretRef:
                name: aws-credentials
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false

---
# Source: flask-aws-monitor/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-aws-monitor
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Source: flask-aws-monitor/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-aws-monitor
  labels:
    helm.sh/chart: flask-aws-monitor-0.1.0
    app.kubernetes.io/name: flask-aws-monitor
    app.kubernetes.io/instance: flask-aws-monitor
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: traefik
  rules:
    -
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-aws-monitor
                port:
                  number: 5001
