apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: flask-aws-monitor
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/shaharc20-bit/project1finel.git
        revision: main
        directories:
          - path: gitops/envs/*
  template:
    metadata:
      name: 'flask-aws-monitor-{{path.basename}}'
      labels:
        app: flask-aws-monitor
        env: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/shaharc20-bit/project1finel.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'flask-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
