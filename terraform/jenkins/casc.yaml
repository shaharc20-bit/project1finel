jenkins:
  systemMessage: "aws-lab Jenkins - configured as code (JCasC)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub"
              username: "shaharc20"
              password: "${DOCKERHUB_TOKEN}"
              description: "Docker Hub"
          - usernamePassword:
              scope: GLOBAL
              id: "github"
              username: "shaharc20-bit"
              password: "${GITHUB_TOKEN}"
              description: "GitHub"

jobs:
  - script: |
      pipelineJob('flask-pipeline') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/shaharc20-bit/project1finel.git')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
